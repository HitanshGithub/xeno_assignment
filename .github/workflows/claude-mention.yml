# Interactive Claude — mention `@claude` in any issue or PR comment and it
# responds in-thread: answers questions, or implements a change and pushes/PRs.
#
# This complements claude-issue-solver.yml (the autonomous, label-driven one):
#   - claude-issue-solver → "pick an issue and open a PR" with no human in the loop
#   - claude-mention      → "Claude, do X here" on demand, conversationally
name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  respond:
    # Only fire when a human mentions @claude (ignore the bot's own comments).
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'assigned')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (Pro/Max) — generated with `claude setup-token`.
          # For an API key instead: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          trigger_phrase: '@claude'
          claude_args: '--max-turns 30 --allowedTools "Bash,Edit,Write,Read,Glob,Grep"'

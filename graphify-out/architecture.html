<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadence — System Architecture</title>
    <style>
      :root {
        --bg: #100e0c; --ink: #f3eee4; --muted: #a99f8d; --faint: #6f685a;
        --brand: #e0975a; --green: #6bbf94; --blue: #74a7d6; --terra: #e07a5f; --purple: #bd8bd6;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body {
        display: grid; place-items: center; min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
        background-image:
          radial-gradient(900px 480px at 18% -10%, rgba(224,151,90,0.08), transparent 70%),
          radial-gradient(700px 480px at 100% 0%, rgba(107,191,148,0.05), transparent 60%);
      }
      .wrap { width: min(1280px, 96vw); }
      svg { width: 100%; height: auto; display: block; }
      text { fill: var(--ink); }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: var(--muted); }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-sub { font-size: 12.5px; fill: var(--muted); }
      .pill-t { font-size: 14px; font-weight: 600; }
      .pill-s { font-size: 11.5px; fill: var(--muted); }
      .edge-label { font-size: 12.5px; font-weight: 600; }
      .edge-sub { font-size: 11px; fill: var(--muted); }
      .note { font-size: 13px; fill: var(--muted); }
      .note b { fill: var(--ink); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg viewBox="0 0 1280 770" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="aN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#8a8170" />
          </marker>
          <marker id="aA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#e0975a" />
          </marker>
          <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#74a7d6" />
          </marker>
          <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#6bbf94" />
          </marker>
        </defs>

        <!-- header -->
        <text class="title" x="40" y="48">Cadence — System Architecture</text>
        <text class="subtitle" x="40" y="74">An AI-native campaign CRM. Two services, an asynchronous callback-driven delivery loop.</text>

        <!-- Gemini (top) -->
        <rect x="332" y="98" width="320" height="62" rx="12" fill="#241a2e" stroke="#bd8bd6" stroke-width="1.5"/>
        <text class="box-title" x="492" y="126" text-anchor="middle">Google Gemini API</text>
        <text class="box-sub" x="492" y="146" text-anchor="middle">Flash model · also Anthropic / free mock — swappable</text>

        <!-- Browser (left) -->
        <rect x="40" y="350" width="158" height="110" rx="12" fill="#141d26" stroke="#74a7d6" stroke-width="1.5"/>
        <text class="box-title" x="119" y="398" text-anchor="middle">Marketer</text>
        <text class="box-sub" x="119" y="418" text-anchor="middle">browser</text>

        <!-- CRM container (Vercel) -->
        <rect x="262" y="190" width="440" height="430" rx="16" fill="#15110d" stroke="#423a2e" stroke-width="1.5"/>
        <text class="box-title" x="282" y="220">CRM app  ·  Vercel</text>
        <text class="box-sub" x="282" y="240">Next.js — full-stack (TypeScript)</text>

        <rect x="284" y="256" width="396" height="62" rx="10" fill="#211b15" stroke="#3a3228"/>
        <text class="pill-t" x="482" y="282" text-anchor="middle">UI  (React, App Router)</text>
        <text class="pill-s" x="482" y="301" text-anchor="middle">dashboard · co-pilot · campaigns · segments</text>

        <rect x="284" y="330" width="396" height="58" rx="10" fill="#211b15" stroke="#3a3228"/>
        <text class="pill-t" x="482" y="354" text-anchor="middle">REST API  (route handlers)</text>
        <text class="pill-s" x="482" y="372" text-anchor="middle">17 endpoints</text>

        <rect x="284" y="400" width="396" height="78" rx="10" fill="#211b15" stroke="#3a3228"/>
        <text class="pill-t" x="482" y="424" text-anchor="middle">Domain layer</text>
        <text class="pill-s" x="482" y="442" text-anchor="middle">segment compiler · campaign launch</text>
        <text class="pill-s" x="482" y="458" text-anchor="middle">receipt ingestion · attribution · insights</text>

        <rect x="284" y="490" width="396" height="60" rx="10" fill="#241a2e" stroke="#bd8bd6" stroke-opacity="0.5"/>
        <text class="pill-t" x="482" y="514" text-anchor="middle" fill="#d9b8ec">AI co-pilot</text>
        <text class="pill-s" x="482" y="532" text-anchor="middle">NL → audience · drafting · insights (typed + zod-validated)</text>

        <!-- Channel container (Render) -->
        <rect x="860" y="250" width="330" height="320" rx="16" fill="#1e1410" stroke="#e07a5f" stroke-opacity="0.55" stroke-width="1.5"/>
        <text class="box-title" x="880" y="280">Channel service  ·  Render</text>
        <text class="box-sub" x="880" y="300">stubbed channel (Express) — long-running</text>

        <rect x="882" y="316" width="286" height="58" rx="10" fill="#241712" stroke="#4a2d23"/>
        <text class="pill-t" x="1025" y="340" text-anchor="middle">POST /v1/send</text>
        <text class="pill-s" x="1025" y="358" text-anchor="middle">Bearer auth · idempotent accept</text>

        <rect x="882" y="388" width="286" height="58" rx="10" fill="#241712" stroke="#4a2d23"/>
        <text class="pill-t" x="1025" y="412" text-anchor="middle">Lifecycle simulator</text>
        <text class="pill-s" x="1025" y="430" text-anchor="middle">per-channel state machine</text>

        <rect x="882" y="460" width="286" height="58" rx="10" fill="#241712" stroke="#4a2d23"/>
        <text class="pill-t" x="1025" y="484" text-anchor="middle">RetryQueue</text>
        <text class="pill-s" x="1025" y="502" text-anchor="middle">backoff · dead-letter</text>

        <!-- Neon (bottom) -->
        <rect x="332" y="660" width="300" height="66" rx="12" fill="#142019" stroke="#6bbf94" stroke-width="1.5"/>
        <text class="box-title" x="482" y="690" text-anchor="middle">Neon Postgres</text>
        <text class="box-sub" x="482" y="709" text-anchor="middle">Prisma · 8 models · 480 customers, 13k orders</text>

        <!-- EDGES -->
        <!-- browser <-> CRM -->
        <line x1="198" y1="405" x2="262" y2="405" stroke="#8a8170" stroke-width="1.6" marker-start="url(#aN)" marker-end="url(#aN)"/>
        <text class="edge-label" x="230" y="394" text-anchor="middle" fill="#74a7d6">UI</text>

        <!-- Gemini <-> CRM AI (vertical-ish): from CRM AI box up to Gemini -->
        <path d="M 540 490 C 540 320, 540 230, 522 160" fill="none" stroke="#bd8bd6" stroke-width="1.6" marker-start="url(#aN)" marker-end="url(#aN)"/>
        <text class="edge-label" x="566" y="250" fill="#bd8bd6">AI</text>
        <text class="edge-sub" x="566" y="266">tool-use / JSON</text>

        <!-- CRM -> Channel : send (top arrow, right) -->
        <line x1="702" y1="345" x2="860" y2="345" stroke="#8a8170" stroke-width="2" marker-end="url(#aN)"/>
        <text class="edge-label" x="781" y="333" text-anchor="middle">POST /v1/send</text>
        <text class="edge-sub" x="781" y="350" text-anchor="middle">batch · Bearer</text>

        <!-- Channel -> CRM : receipts (bottom arrow, left) — THE LOOP, amber -->
        <line x1="860" y1="470" x2="702" y2="470" stroke="#e0975a" stroke-width="2.6" marker-end="url(#aA)"/>
        <text class="edge-label" x="781" y="492" text-anchor="middle" fill="#e0975a">POST /api/receipts</text>
        <text class="edge-sub" x="781" y="508" text-anchor="middle" fill="#e0975a">HMAC-signed · async · out-of-order</text>

        <!-- CRM -> Neon -->
        <line x1="482" y1="620" x2="482" y2="660" stroke="#6bbf94" stroke-width="1.8" marker-end="url(#aG)"/>
        <text class="edge-label" x="500" y="646" fill="#6bbf94">Prisma</text>

        <!-- the loop label -->
        <text class="edge-sub" x="781" y="232" text-anchor="middle" fill="var(--faint)">⟲ the async delivery loop</text>

        <!-- footnotes -->
        <text class="note" x="40" y="752"><tspan fill="#e0975a">●</tspan>  Receipts → append-only event log → <b>monotonic status projection</b> (idempotent, safe out-of-order).
          <tspan dx="22" fill="#bd8bd6">●</tspan>  Audience = <b>transparent, editable rule tree</b> compiled to parameterised SQL.
          <tspan dx="22" fill="#6bbf94">●</tspan>  Human-in-the-loop: AI proposes, marketer reviews & ships.</text>
      </svg>
    </div>
  </body>
</html>

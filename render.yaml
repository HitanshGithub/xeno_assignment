# Render blueprint for the channel simulator (the second service).
# The CRM/web app deploys to Vercel; the channel service is a plain Node web
# service and Render is the simplest home for it.
#
# Deploy: New + → Blueprint → point at this repo. Render reads this file.
# Render injects PORT automatically; the service reads it (see config.ts).
#
# After it's up, set the two sync:false secrets below to the SAME values you put
# in Vercel (CHANNEL_SERVICE_API_KEY + CHANNEL_CALLBACK_SECRET). See DEPLOY.md.
# (The channel learns the CRM callback URL from each send request, so it does
# not need CRM_BASE_URL of its own.)
services:
  - type: web
    name: cadence-channel
    runtime: node
    plan: free
    # --include=dev so tsx (the channel's runtime) installs even if the host
    # defaults NODE_ENV to production.
    buildCommand: npm install --include=dev
    startCommand: npm run start -w @cadence/channel-sim
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: CHANNEL_SPEED
        value: '0.12'
      # Must match the values set in Vercel.
      - key: CHANNEL_SERVICE_API_KEY
        sync: false
      - key: CHANNEL_CALLBACK_SECRET
        sync: false
